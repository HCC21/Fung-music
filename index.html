<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fung Fung Music</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
</head>

<body>

<body>

<!-- 🎉 登入後歡迎提示 -->
<div id="welcome-popup" class="welcome-popup">
  <div class="welcome-box">
    <h2 id="welcome-popup-text"></h2>
    <p>祝你聽歌愉快！</p>
  </div>
</div>

<!-- 🎛️ 管理員密碼輸入框 -->
<input type="password" id="admin-password" placeholder="管理員密碼" style="display:none;">
<button id="admin-btn" style="display:none;">開啟管理員後台</button>

<!-- 🎛️ 管理員後台頁面 -->
<div id="admin-panel" style="display:none;">
    <h2>管理員後台</h2>

<div class="row-box">
    <div class="col-box">
        <h3>播放紀錄</h3>
        <ul id="history-list" class="admin-box"></ul>
    </div>

    <div class="col-box">
        <h3>Like 紀錄</h3>
        <ul id="like-history-list" class="admin-box"></ul>
    </div>
</div>

<div class="row-box">
    <div class="col-box">
        <h3>所有登入紀錄</h3>
        <ul id="admin-login-history" class="admin-box"></ul>
    </div>

<div class="col-box">
    <div class="title-row">
        <h3>用戶管理</h3>
        <button id="add-user-btn">新增用戶</button>
    </div>

    <ul id="user-list" class="admin-box"></ul>
</div>
</div>

<div class="row-box">
    <div class="col-box">
        <h3>GitHub 設定 (上傳專用)</h3>
        <div class="admin-box upload-section">
            <label>GitHub 帳號名稱：</label>
            <input type="text" id="gh-username" placeholder="例如：yourname">
            <label>倉庫名稱 (Repo)：</label>
            <input type="text" id="gh-repo" placeholder="例如：music-site">
            <label>GitHub Token：</label>
            <input type="password" id="gh-token" placeholder="貼上您的 Token">
            <button id="gh-save-btn" style="margin-top: 10px; width: 100%;">儲存 GitHub 設定</button>
        </div>
    </div>

    <div class="col-box">
        <h3>上傳歌曲 / 更換封面</h3>
        <div class="admin-box upload-section">
            <label>歌曲名稱：</label>
            <input type="text" id="upload-song-name" placeholder="例如：我的歌曲">
            
            <label>分類：</label>
            <select id="upload-song-cat">
                <option value="slow songs">慢歌</option>
                <option value="fast songs">快歌</option>
                <option value="female">女歌男唱</option>
                <option value="kids">兒歌/卡通</option>
                <option value="opera">粵曲</option>
                <option value="festival">節日</option>
                <option value="other">其他</option>
                <option value="man">敏敏歌單</option>
                <option value="manman">合唱歌單</option>
            </select>

            <label>選擇音檔 (.mp3)：</label>
            <input type="file" id="upload-song-file" accept="audio/mpeg">
            
            <label>選擇封面 (.jpg/.png)：</label>
            <input type="file" id="upload-cover-file" accept="image/*">
            
            <button id="upload-submit-btn" style="margin-top: 10px; width: 100%;">開始上傳</button>
            <p id="upload-status" style="font-size: 12px; color: #666; margin-top: 5px;"></p>
        </div>
    </div>
</div>


    <button id="admin-close">關閉</button>
</div>

<!-- 🎵 主頁內容 -->
<div class="container">
  <div class="sidebar">
    <h2 id="welcome-text"></h2>
 
<h3>分類</h3>
<select id="categories-select">
  <option value="all">全部歌曲</option>
  <option value="slow songs">慢歌</option>
  <option value="fast songs">快歌</option>
  <option value="female">女歌男唱</option>
  <option value="kids">兒歌/卡通</option>
  <option value="opera">粵曲</option>
  <option value="festival">節日</option>
 <option value="other">其他</option>
  <option value="man">敏敏歌單</option>
  <option value="manman">合唱歌單</option>
</select>

    <input type="text" id="search" placeholder="搜尋歌曲..." class="search-box">

 <h3>主題</h3>
    <select id="theme-select">
      <option value="theme-default">預設</option>
      <option value="theme-sakura">櫻花模式</option>
      <option value="theme-tech">科技模式</option>
      <option value="theme-cartoon">卡通模式</option>
    </select>

<h3>🎮 小遊戲</h3>
<select id="game-select">
  <option value="">選擇遊戲</option>
  <option value="sakura">🌸 櫻花接花</option>
  <option value="cartoon">🎨 卡通跳跳樂</option>
</select>
 
    <button id="logout-btn" class="logout-btn">登出</button>
  </div>

 <div class="player-area">
    <div class="cd-wrapper">
  <img id="cover" src="covers/default.jpg" class="cd">
  <img id="tonearm" src="tonearm.svg" class="tonearm">
</div>

    <h2 id="title">選擇一首歌播放</h2>
    <audio id="audio"></audio>
 
   <div class="progress-container">
      <span id="current">0:00</span>
      <input type="range" id="progress" value="0" min="0" max="100">
      <span id="duration">0:00</span>
    </div>

 <div class="controls">
 <button id="play" class="play-btn">▶️</button>
 <button id="stop">⏹️</button>     <!-- ⭐ Stop Key -->
 <button id="prev">⏮️</button>
 <button id="next">⏭️</button>
 <button id="random">🔀</button>   <!-- ⭐ Random Key -->
 
</div>


    <!-- ⭐ 留言區 -->
    <div id="comment-section" style="margin-top: 20px;">
      <h3>留言區</h3>

      <ul id="comment-list" style="list-style:none; padding:0; margin-bottom:10px;"></ul>

      <textarea id="comment-input" placeholder="寫下你的留言..." 
                style="width:100%; height:60px;"></textarea>
      <button id="comment-submit">送出留言</button>
    </div>
<p id="comment-hint" style="color:red; font-size:14px; margin-top:5px;"></p>

<p id="reply-notice" style="color:orange; font-size:14px; margin-top:10px;"></p>

    <!-- ⭐ 播放清單（移到留言區下方） -->
    <div id="playlist-section" style="margin-top: 25px;">
      <h3>播放清單 Playlist</h3>
      <div id="playlist-buttons"></div>
    </div>

  </div>
</div>

<!-- 🎆 登入煙花 -->
<canvas id="fireworks"></canvas>

<!-- 🎮 小遊戲 Modal -->
<div id="game-modal" class="game-modal">
  <div class="game-box">
    <button id="game-close" class="game-close">✖</button>
    <canvas id="game-canvas"></canvas>
    <div id="game-ui"></div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

<script src="songsData.js"></script>
<script src="script.js"></script>

</body>
</html>
